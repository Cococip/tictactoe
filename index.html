<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANOA TIC-TAC-TOE - Permainan Tic Tac Toe</title>
  <meta name="description" content="Permainan Tic Tac Toe dengan AI cerdas dan musik latar">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Nova+Mono" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css'>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>ANOA TIC-TAC-TOE</h1>
  </header>

  <!-- Audio Element -->
  <audio id="playMusic" preload="auto">
    <source src="https://drive.google.com/uc?export=download&id=1SeLDhw8eb6mtAGg4pG0xPGKWDcu2mfPH" type="audio/mpeg">
    <p>Browser Anda tidak mendukung elemen audio.</p>
  </audio>

  <main id="contentVue">
    <!-- Game Controls -->
    <div id="btnOptionsParent" class="game-controls">
      <button id="btnSound" class="control-btn" aria-label="Toggle musik">
        <i class="fa fa-volume-up" aria-hidden="true"></i>
        <span>Musik</span>
      </button>
      <button id="btnOptionsChild" class="control-btn" @click="backToOptions()" aria-label="Permainan baru">
        <i class="fa fa-cog" aria-hidden="true"></i>
        <span>Permainan Baru</span>
      </button>
      <div id="optionsOverlay" class="options-overlay"></div>
    </div>

    <!-- Game Setup Modal -->
    <div id="modal" class="modal-vue" role="dialog" aria-labelledby="modal-title">
      <div class="overlay" v-if="showModal" @click="closeModal()"></div>
      <div class="modal" v-if="showModal" role="document">
        <div class='modalGrid center'>
          <div class="vs">
            <img src="http://res.cloudinary.com/azametzin/image/upload/v1507661608/Tic-Tac-Toe/vs.png" alt="Versus" />
          </div>
          <div class="options">
            <h2 id="modal-title">Pilihan</h2>
          </div>
          <div class="box play1">Pemain 1</div>
          <div class="box play2">
            <div id="player2" class="player-option">
              <span id='selMarkPlayer2' class="selection-mark">
                <i class="fa fa-caret-right" aria-hidden="true"></i>
              </span>
              <span id="player2Select">Pemain 2</span>
            </div>
            <div id="cpu" class="player-option">
              <span id='selMarkCPU' class="selection-mark">
                <i class="fa fa-caret-right" aria-hidden="true"></i>
              </span>
              <span id="cpuSelect">Komputer</span>
            </div>
          </div>
          <div class="box nick1">
            <input id="nick1Input" type="text" name="nick1" placeholder="Nickname" maxlength="8" pattern="[a-zA-Z0-9-]+" aria-label="Nickname pemain 1">
          </div>
          <div class="box nick2">
            <input id="nick2Input" type="text" name="nick2" placeholder="Nickname" maxlength="8" pattern="[a-zA-Z0-9-]+" aria-label="Nickname pemain 2">
          </div>
          <div class="sign1">
            <i class="fa fa-circle-o" aria-hidden="true"></i>
          </div>
          <div class="sign2">
            <i class="fa fa-times" aria-hidden="true"></i>
          </div>
          <div class="exchangingAndOK">
            <button id="exchangeBtn" class="exchange-btn" aria-label="Tukar simbol">
              <i class="fa fa-exchange" aria-hidden="true"></i>
            </button>
            <br><br>
            <button id='okBtn' class="ok-btn" @click="okButtonClicked()">OKE</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Board -->
    <section class="container" role="grid" aria-label="Papan permainan Tic Tac Toe">
      <div class="playerSide player1-Title">
        <div id="player-1" class="title-players" role="banner"></div>
      </div>
      
      <div class="item item-1" role="gridcell">
        <div id="square1" class="squares" data-mark="1" tabindex="0" role="button" aria-label="Kotak 1"></div>
      </div>
      <div class="item item-2" role="gridcell">
        <div id="square2" class="squares" data-mark="2" tabindex="0" role="button" aria-label="Kotak 2"></div>
      </div>
      <div class="item item-3" role="gridcell">
        <div id="square3" class="squares" data-mark="3" tabindex="0" role="button" aria-label="Kotak 3"></div>
      </div>
      
      <div class="playerSide player2-Title">
        <div id="player-2" class="title-players" role="banner"></div>
      </div>
      
      <div id="player1-info" class="playerSide player1-Avatar">
        <div id="player1-info-inside"></div>
      </div>
      <div class="item item-4" role="gridcell">
        <div id="square4" class="squares" data-mark="4" tabindex="0" role="button" aria-label="Kotak 4"></div>
      </div>
      <div class="item item-5" role="gridcell">
        <div id="square5" class="squares" data-mark="5" tabindex="0" role="button" aria-label="Kotak 5"></div>
      </div>
      <div class="item item-6" role="gridcell">
        <div id="square6" class="squares" data-mark="6" tabindex="0" role="button" aria-label="Kotak 6"></div>
      </div>
      <div id="player2-info" class="playerSide player2-Avatar">
        <div id="player2-info-inside"></div>
      </div>
      
      <div class="playerSide player1-Msg">
        <div id="player-1-Msg" class="players-msg" role="status" aria-live="polite"></div>
      </div>
      <div class="item item-7" role="gridcell">
        <div id="square7" class="squares" data-mark="7" tabindex="0" role="button" aria-label="Kotak 7"></div>
      </div>
      <div class="item item-8" role="gridcell">
        <div id="square8" class="squares" data-mark="8" tabindex="0" role="button" aria-label="Kotak 8"></div>
      </div>
      <div class="item item-9" role="gridcell">
        <div id="square9" class="squares" data-mark="9" tabindex="0" role="button" aria-label="Kotak 9"></div>
      </div>
      <div class="playerSide player2-Msg">
        <div id="player-2-Msg" class="players-msg" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/vue/2.3.4/vue.min.js'></script>
  <script src="./script.js"></script>
</body>
</html>
